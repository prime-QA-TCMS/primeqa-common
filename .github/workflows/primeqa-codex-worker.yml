name: Prime QA Codex Worker

on:
  repository_dispatch:
    types: [primeqa-codex-task]

permissions:
  contents: read

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: prime-QA-TCMS/primeqa-project
          token: ${{ secrets.PRIMEQA_AUTOMATION_TOKEN }}
          path: _control
          persist-credentials: false
      - run: echo '_control/' >> .git/info/exclude
      - name: Fetch central work item
        env:
          GH_TOKEN: ${{ secrets.PRIMEQA_AUTOMATION_TOKEN }}
          CONTROL_REPO: ${{ github.event.client_payload.control_repo }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
        run: gh api "/repos/$CONTROL_REPO/issues/$ISSUE_NUMBER" --jq '.body' > /tmp/primeqa-work-item.md
      - name: Preinstall Node dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --no-audit --no-fund
      - name: Run Codex implementation agent
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt: |
            You are the Developer agent in the Prime QA automated SDLC. Read _control/AGENTS.md,
            _control/requirements/technical-requirements.md, _control/ai-sdlc/README.md,
            _control/ai-sdlc/agents.md, _control/ai-sdlc/definition-of-done.md and /tmp/primeqa-work-item.md.
            Implement ONLY this repository's required work. This is a shared backend package: preserve compatibility,
            keep platform concerns generic, add/update tests and docs, and do not invent requirements. Run applicable
            checks using installed dependencies. Do not commit/push/merge/deploy or modify _control.
      - name: Open implementation PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PRIMEQA_AUTOMATION_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          ISSUE_URL: ${{ github.event.client_payload.issue_url }}
          CODEX_SUMMARY: ${{ steps.codex.outputs.final-message }}
        run: |
          if git diff --quiet && test -z "$(git status --porcelain)"; then echo 'created=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          BRANCH="ai/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git config user.name 'primeqa-codex[bot]'; git config user.email 'primeqa-codex[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"; git add -A; git commit -m "ai-sdlc: implement issue ${ISSUE_NUMBER}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          printf 'Central work item: %s\n\nIndependent review and QA required.\n\nCodex evidence summary:\n%s\n' "$ISSUE_URL" "$CODEX_SUMMARY" > /tmp/pr-body.md
          PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --draft --title "[AI-SDLC] Issue ${ISSUE_NUMBER}" --body-file /tmp/pr-body.md)
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"; echo 'created=true' >> "$GITHUB_OUTPUT"
      - name: Advance central item
        if: steps.pr.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIMEQA_AUTOMATION_TOKEN }}
          CONTROL_REPO: ${{ github.event.client_payload.control_repo }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$CONTROL_REPO" --body "Implementation PR created: $PR_URL\n\nState advanced to independent review."
          for label in state:implementation agent:developer ai:running ai:ready; do gh issue edit "$ISSUE_NUMBER" --repo "$CONTROL_REPO" --remove-label "$label" >/dev/null 2>&1 || true; done
          gh issue edit "$ISSUE_NUMBER" --repo "$CONTROL_REPO" --add-label 'state:review,agent:reviewer,shared-package' >/dev/null
